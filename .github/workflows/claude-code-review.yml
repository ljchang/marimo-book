name: Claude Code Review

# Automatic Claude review on every non-draft PR from a branch in this repo.
#
# Direct prompt-based review (no plugin): the code-review plugin launches its
# reviewers as *background* sub-agents and the parent ends its turn waiting
# for them, which ends a headless Actions run before anything is posted
# (three runs on #78 confirmed this). The prompt below does the review in
# one session and posts inline comments plus a summary.
#
# With a custom --allowedTools the action passes the list through unchanged,
# so the sticky-comment tool (mcp__github_comment__update_claude_comment) must
# be listed explicitly — the action's own prompt tells Claude to post through
# it, and leaving it out produced permission denials and a run that looped to
# the turn cap.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (subscription token from `claude setup-token`).
# The Claude GitHub App must be installed on the repo. Fork PRs never see
# repository secrets, so on those this job fails at auth — expected.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          # Diagnostic: surfaces permission_denied entries in the Actions log.
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness. Do the whole review yourself in
            this session: do NOT launch sub-agents or background tasks (a headless run
            ends when you stop, so anything you delegate is lost).

            Steps:
            1. `gh pr view <PR> --json title,body` and `gh pr diff <PR>` to read the change.
               Read CLAUDE.md at the repo root; it carries project rules (release flow,
               things to avoid, cache/signature invariants, feature-flag conventions).
            2. Read the surrounding code of each changed hunk (Read/Grep) as needed to
               judge it in context. Use `git log`/`git blame` when history matters.
            3. Look for: bugs introduced by the change (wrong logic, missing edge case,
               broken invariant, mismatched test expectation), CLAUDE.md violations, and
               changes that would silently invalidate caches or committed artifacts.
               Ignore style, pre-existing issues, and anything a linter would catch.
            4. For each issue you are highly confident is real, post ONE inline comment
               with `mcp__github_inline_comment__create_inline_comment` on the exact
               line, stating the problem and the concrete failure scenario in 2-4
               sentences. No duplicates, no praise comments.
            5. Finish by writing a short summary into the sticky Claude comment with
               `mcp__github_comment__update_claude_comment` (body only): either
               "No high-confidence issues found." or a numbered list of the issues
               you posted, each one line. Do not create additional top-level comments.
          claude_args: |
            --allowedTools "Read,Grep,Glob,LS,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(git blame:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            --max-turns 80
