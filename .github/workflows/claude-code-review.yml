name: Claude Code Review

# Automatic Claude review on every non-draft PR from a branch in this repo.
# Uses the code-review plugin with `--comment` so findings land as inline
# review comments. Fork PRs never see repository secrets, so on those this
# job fails at auth — that is expected on a public repo.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (subscription token from `claude setup-token`).
# The Claude GitHub App must also be installed on the repo for comments to post.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment" --max-turns 40'
