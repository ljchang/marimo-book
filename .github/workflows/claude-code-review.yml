name: Claude Code Review

# Automatic Claude review on every non-draft PR from a branch in this repo.
# Uses the code-review plugin with `--comment` so findings land as inline
# review comments. Fork PRs never see repository secrets, so on those this
# job fails at auth — that is expected on a public repo.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (subscription token from `claude setup-token`).
# The Claude GitHub App must also be installed on the repo for comments to post.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The code-review plugin launches sub-agents (Agent), reads the diff
          # and history through gh/git, and posts via gh pr comment + the
          # inline-comment MCP tool. Restricting to the MCP tool alone (first
          # attempt) made every step a permission denial and posted nothing.
          # Full output lands in the (public) Actions log so permission
          # denials are visible; the second run on #78 logged 17 denials
          # and posted nothing. Turn off once the allowlist is settled.
          show_full_output: true
          claude_args: |
            --allowedTools "Agent,Task,Read,Grep,Glob,LS,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh api:*),Bash(gh repo view:*),Bash(git blame:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(git fetch:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(rg:*),Bash(grep:*),Bash(sed -n:*)"
            --max-turns 40
